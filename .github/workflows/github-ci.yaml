name: CI - Build & Push FE Image

on:
  push:
    branches: ["demo"]

env:
  REGISTRY: reg.ospgroup.vn
  IMAGE_NAME: demok8s/bttp-fe

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "🔨 Building docker image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          docker build \
            --no-cache \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1 \
            .

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "📤 Pushing docker images..."
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1

      - name: Cleanup
        if: always()
        run: |
          echo "🗑️ Cleanup images after build..."
          docker system prune -f || true
