name: CI - Build & Push FE Image

on:
  push:
    branches: ["demo"]

env:
  REGISTRY: reg.ospgroup.vn
  IMAGE_NAME: demok8s/bttp-fe

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Docker system thoroughly
        run: |
          # Check Docker status
          docker info
          
          # Stop all containers and remove everything
          docker stop $(docker ps -aq) || true
          docker rm $(docker ps -aq) || true
          docker rmi $(docker images -q) || true
          
          # Clean Docker system completely
          docker system prune -af || true
          
          # Clear Docker temp files that might cause overlay2 issues
          sudo rm -rf /var/lib/docker/tmp/* || true

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build and Push Docker image (Simple Docker)
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          
          # Build image with no-cache to avoid overlay2 issues
          docker build --no-cache -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
          
          # Push main tag
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          
          # Tag and push v1
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1

      - name: Cleanup
        if: always()
        run: |
          # Clean up images after build
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA} || true
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1 || true
          docker system prune -f || true
