name: CI - Build & Push FE Image

on:
  push:
    branches: ["demo"]

env:
  REGISTRY: reg.ospgroup.vn
  IMAGE_NAME: demok8s/bttp-fe

jobs:
  # ============================================
  # Cách 1: Làm sạch toàn bộ Docker storage trước khi build
  # ============================================
  build-clean-docker:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reset Docker storage
        run: |
          echo "⚠️ Wiping Docker storage to fix overlay2 corruption..."
          sudo systemctl stop docker || true
          sudo rm -rf /var/lib/docker/*
          sudo systemctl start docker || true

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build and Push Docker image (classic docker build)
        run: |
          set -xe
          IMAGE_TAG=${GITHUB_SHA}
          echo "🔨 Building image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          ls -lah
          
          docker build --no-cache -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}

          echo "🏷️ Tagging as v1"
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1

      - name: Cleanup
        if: always()
        run: |
          echo "🗑️ Cleanup images after build..."
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA} || true
          docker rmi ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1 || true
          docker system prune -f || true

  # ============================================
  # Cách 2: Sử dụng docker buildx (khuyên dùng)
  # ============================================
  build-buildx:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push Docker image (with buildx)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
