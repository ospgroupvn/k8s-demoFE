name: CI - Build & Push FE Image

on:
  push:
    branches: ["demo"]

env:
  REGISTRY: reg.ospgroup.vn
  IMAGE_NAME: demok8s/bttp-fe

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name mybuilder || true
          docker buildx inspect --bootstrap

      - name: Build and Push Docker image (Buildx)
        working-directory: ${{ github.workspace }}
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "🔨 Building with buildx ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "📂 Current dir: $(pwd)"
          ls -lah

          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1 \
            --push .

      - name: Cleanup
        if: always()
        run: |
          echo "🗑️ Cleanup images after build..."
          docker system prune -f || true
