name: CI - Build & Push FE Image (Simple Docker)

on:
  push:
    branches: ["demo"]

env:
  REGISTRY: reg.ospgroup.vn
  IMAGE_NAME: demok8s/bttp-fe

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker and clean system
        run: |
          # Ensure Docker daemon is running
          sudo systemctl start docker || true
          sleep 5
          
          # Clean Docker system thoroughly
          docker system prune -af || true
          sudo rm -rf /var/lib/docker/tmp/* || true
          
          # Restart Docker daemon to clear any overlay2 issues
          sudo systemctl restart docker
          sleep 10

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          
          # Build image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
          
          # Push main tag
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          
          # Tag and push v1
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v1

      - name: Cleanup
        if: always()
        run: |
          docker system prune -f || true